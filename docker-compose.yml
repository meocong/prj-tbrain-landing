version: "3.9"

services:
  tbrain-lp:
    ports:
      - "3289:3000"
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: tbrain_lp_img:latest
    restart: always
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tbrain-lp.rule=Host(`tbrain.ai`)"
      - "traefik.http.routers.tbrain-lp.entrypoints=https"
      - "traefik.http.services.tbrain-lp.loadbalancer.server.port=3000"
      - "traefik.http.routers.tbrain-lp.tls=true"
      - "traefik.http.routers.tbrain-lp.tls.certresolver=letsencrypt"

networks:
  traefik-net:
    external: true
